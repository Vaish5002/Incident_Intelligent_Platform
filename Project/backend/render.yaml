services:
  - type: web
    name: smartops-ai-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: Project/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8002
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        value: sqlite:///./smartops_ai.db
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health
